    min: 90.0
    max: 90.0
    layers: [V5.edges]
  - name: V5HEdges
    op: with_angle
    min: 0.0
    max: 0.0
    layers: [V5.edges]
  - name: V5VEdgesOutM5
    op: outside_part
    layers: [V5VEdges, M5]
  - name: V5VEdgesOffM5
    op: not
