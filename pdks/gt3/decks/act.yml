# Active (Include/gt3.act.drc.rs).  ACT.4, a continuous active, has no check upstream,
# and ACT.5, an active that does not bend, is commented out there.
rules:
  - id: ACT.1
    check: min_width
    layers: [ACT]
    value: 0.01
    params:
      facing: y
  - id: ACT.2
    check: min_width
    layers: [ACT]
    value: 0.084
    params:
      facing: x
  - id: ACT.3
    check: min_space
    layers: [ACT]
    value: 0.03
    params:
      facing: y
  - id: ACT.3
    check: min_notch
    layers: [ACT]
    value: 0.03
    params:
      facing: y
  # An active ends inside a DUMMY: its vertical edges lie in one.
  - id: ACT.6
    check: forbidden
    layers: [ActVEdgesOffDummy]
    value: 0.0
  - id: ACT.BPR.1
    check: min_space
    layers: [ACT, BPR]
    value: 0.01
    params:
      facing: y
