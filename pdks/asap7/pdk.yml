# ASAP7, the 7 nm predictive FinFET PDK from Arizona State University and ARM (release
# 1p7).  The rules are the design rule manual's (asap7_drm_201207a.pdf); the foundry-style
# Calibre deck is not public, so the manual is the reference, with the KLayout port at
# github.com/laurentc2/ASAP7_for_KLayout read alongside it for what each rule measures.
#
# Layouts are drawn at the real 7 nm scale on a 0.25 nm grid (4000 DBU per um), the way
# the standard-cell libraries ship; an older layout drawn 4x up for Calibre must be
# scaled first.
#
# Most layers route one way, and the manual words their rules so: "minimum horizontal
# width of WELL", "minimum vertical spacing of ACTIVE".  Those rules read `facing: x`
# (vertical walls, a horizontal span) or `facing: y`.  A via "enclosed on two opposite
# sides" is `sides: opposite`.  Each deck's header lists the rules of its section it
# does not check, and why.
name: ASAP7
version: "1p7"

suites:
  - name: main
    path: suites/main.yml
    description: Full DRC - every deck
  - name: feol
    path: suites/feol.yml
    description: Front end and middle of line, through V0 (a standard cell)
  - name: beol
    path: suites/beol.yml
    description: Routing stack, M1 to the pad

decks:
  - name: geometry
    path: decks/geometry.yml
    description: Non-orthogonal shapes
  - name: well
    path: decks/well.yml
    description: N-well
  - name: fin
    path: decks/fin.yml
    description: Fin
  - name: gate
    path: decks/gate.yml
    description: Gate
  - name: active
    path: decks/active.yml
    description: Active area
  - name: gcut
    path: decks/gcut.yml
    description: Gate cut
  - name: select
    path: decks/select.yml
    description: N/P implant and threshold-adjust layers
  - name: sdt
    path: decks/sdt.yml
    description: Source/drain trench
  - name: lisd
    path: decks/lisd.yml
    description: Source/drain local interconnect
  - name: lig
    path: decks/lig.yml
    description: Gate local interconnect
  - name: v0
    path: decks/v0.yml
    description: Via LIG/LISD to M1
  - name: m1
    path: decks/m1.yml
    description: Metal 1
  - name: v1
    path: decks/v1.yml
    description: Via 1
  - name: m2
    path: decks/m2.yml
    description: Metal 2
  - name: v2
    path: decks/v2.yml
    description: Via 2
  - name: m3
    path: decks/m3.yml
    description: Metal 3
  - name: v3
    path: decks/v3.yml
    description: Via 3
  - name: m4
    path: decks/m4.yml
    description: Metal 4
  - name: v4
    path: decks/v4.yml
    description: Via 4
  - name: m5
    path: decks/m5.yml
    description: Metal 5
  - name: v5
    path: decks/v5.yml
    description: Via 5
  - name: m6
    path: decks/m6.yml
    description: Metal 6
  - name: v6
    path: decks/v6.yml
    description: Via 6
  - name: m7
    path: decks/m7.yml
    description: Metal 7
  - name: v7
    path: decks/v7.yml
    description: Via 7
  - name: m8
    path: decks/m8.yml
    description: Metal 8
  - name: v8
    path: decks/v8.yml
    description: Via 8
  - name: m9
    path: decks/m9.yml
    description: Metal 9
  - name: v9
    path: decks/v9.yml
    description: Via 9 to the pad

virtual_layers:
  # GATE regions a GCUT does not cut: what the manual calls "GATE (not cut by GCUT)".
  - name: GateNoCut
    op: difference
    mode: lazy
    layers: [GATE, GCUT]
  - name: GateNoCutNoSram
    op: not_interacting
    mode: lazy
    layers: [GateNoCut, SRAMDRC]
  - name: GateNoCutOffActive
    op: not_interacting
    mode: lazy
    layers: [GateNoCut, ACTIVE]
  # The channel: GATE over ACTIVE.
  - name: Channel
    op: intersection
    mode: lazy
    layers: [GATE, ACTIVE]
  - name: ChannelNoCut
    op: intersection
    mode: lazy
    layers: [GateNoCut, ACTIVE]
  # GATE.S.3: every gate needs another within one 54 nm pitch, centre to centre, beside it -
  # a space of at most 34 nm.  Grown by half that across x, two such gates meet and make one
  # region at least 108 nm wide; a gate alone makes one 54 nm wide, which an erosion by 27 nm
  # takes away.  A gate the survivors do not reach has no neighbour.
  - name: GateReach
    op: grow_x
    mode: lazy
    radius: 0.017
    layers: [GateNoCutNoSram]
  - name: GatePaired
    op: shrink_x
    mode: lazy
    radius: 0.027
    layers: [GateReach]
  - name: GateSolitary
    op: not_interacting
    mode: lazy
    layers: [GateNoCutNoSram, GatePaired]
  # "May not bend": a shape that is not a rectangle.
  - name: FinBent
    op: not_rectangle
    mode: lazy
    layers: [FIN]
  - name: GateBent
    op: not_rectangle
    mode: lazy
    layers: [GATE]
  - name: M4Bent
    op: not_rectangle
    mode: lazy
    layers: [M4]
  - name: M5Bent
    op: not_rectangle
    mode: lazy
    layers: [M5]
  - name: M6Bent
    op: not_rectangle
    mode: lazy
    layers: [M6]
  - name: M7Bent
    op: not_rectangle
    mode: lazy
    layers: [M7]
  # ACTIVE, and its parts inside and outside the SRAM marker.
  - name: ActiveSram
    op: interacting
    mode: lazy
    layers: [ACTIVE, SRAMDRC]
  - name: ActiveNoSram
    op: not_interacting
    mode: lazy
    layers: [ACTIVE, SRAMDRC]
  # SRAM.ACTIVE.AUX.2 and its LISD and LIG twins: a shape that shares no area with SRAMDRC
  # may not touch it either.
  - name: ActiveOffSram
    op: not_overlapping
    mode: lazy
    layers: [ACTIVE, SRAMDRC]
  - name: ActiveAbutSram
    op: interacting
    mode: lazy
    layers: [ActiveOffSram, SRAMDRC]
  - name: LisdOffSram
    op: not_overlapping
    mode: lazy
    layers: [LISD, SRAMDRC]
  - name: LisdAbutSram
    op: interacting
    mode: lazy
    layers: [LisdOffSram, SRAMDRC]
  - name: LigOffSram
    op: not_overlapping
    mode: lazy
    layers: [LIG, SRAMDRC]
  - name: LigAbutSram
    op: interacting
    mode: lazy
    layers: [LigOffSram, SRAMDRC]
  - name: Select
    op: union
    mode: lazy
    layers: [NSELECT, PSELECT]
  - name: GcutOffGate
    op: not_interacting
    mode: lazy
    layers: [GCUT, GATE]
  - name: GcutOnChannel
    op: interacting
    mode: lazy
    layers: [GCUT, Channel]
  - name: SdtNoSram
    op: not_interacting
    mode: lazy
    layers: [SDT, SRAMDRC]
  - name: SdtSram
    op: interacting
    mode: lazy
    layers: [SDT, SRAMDRC]
  - name: SdtOnGate
    op: interacting
    mode: lazy
    layers: [SDT, GATE]
  - name: SdtOffActive
    op: not_overlapping
    mode: lazy
    layers: [SDT, ACTIVE]
  - name: LisdNoSram
    op: not_interacting
    mode: lazy
    layers: [LISD, SRAMDRC]
  - name: LisdSram
    op: interacting
    mode: lazy
    layers: [LISD, SRAMDRC]
  - name: LigNoSram
    op: not_interacting
    mode: lazy
    layers: [LIG, SRAMDRC]
  - name: LigSram
    op: interacting
    mode: lazy
    layers: [LIG, SRAMDRC]
  - name: LigOnLisd
    op: intersection
    mode: lazy
    layers: [LIG, LISD]
  - name: LigNoSramOnGate
    op: intersection
    mode: lazy
    layers: [LigNoSram, GateNoCut]
  - name: LigSramOnGate
    op: intersection
    mode: lazy
    layers: [LigSram, GateNoCut]
  # V0 against what it lands on.
  - name: LisdOrLig
    op: union
    mode: lazy
    layers: [LISD, LIG]
  - name: V0OffM1
    op: not_interacting
    mode: lazy
    layers: [V0, M1]
  - name: V0OffLisdLig
    op: not_interacting
    mode: lazy
    layers: [V0, LisdOrLig]
  - name: V0OnLisd
    op: interacting
    mode: lazy
    layers: [V0, LISD]
  - name: V0OnLisdOnly
    op: not_interacting
    mode: lazy
    layers: [V0OnLisd, LIG]
  - name: V0OnLig
    op: interacting
    mode: lazy
    layers: [V0, LIG]
  - name: V0OnLigOffLisd
    op: not_inside
    mode: lazy
    layers: [V0OnLig, LISD]
  - name: V0OnLigArea
    op: intersection
    mode: lazy
    layers: [V0OnLigOffLisd, LIG]
  # V8.W.1 and V9.W.1: a long side of 40 or 120 nm, to the DBU.
  - name: V8Len40
    op: with_bbox_max
    mode: lazy
    min: 0.04
    max: 0.04025
    layers: [V8]
  - name: V8Len120
    op: with_bbox_max
    mode: lazy
    min: 0.12
    max: 0.12025
    layers: [V8]
  - name: V8GoodLength
    op: union
    mode: lazy
    layers: [V8Len40, V8Len120]
  - name: V8BadLength
    op: difference
    mode: lazy
    layers: [V8, V8GoodLength]
  - name: V8NotRect
    op: not_rectangle
    mode: lazy
    layers: [V8]
  - name: V9Len40
    op: with_bbox_max
    mode: lazy
    min: 0.04
    max: 0.04025
    layers: [V9]
  - name: V9Len120
    op: with_bbox_max
    mode: lazy
    min: 0.12
    max: 0.12025
    layers: [V9]
  - name: V9GoodLength
    op: union
    mode: lazy
    layers: [V9Len40, V9Len120]
  - name: V9BadLength
    op: difference
    mode: lazy
    layers: [V9, V9GoodLength]
  - name: V9NotRect
    op: not_rectangle
    mode: lazy
    layers: [V9]

edge_layers:
  # The M1-style spacings (M1-M3, LISD, LIG) turn on the lengths of the two facing edges: a
  # line's side is its long edge (over 36 nm), its tip the short one (36 nm or less), and a
  # tip is `mid` from 24 to 36 nm and `tiny` under 24.  Lengths are whole DBU, so "36 nm or
  # less" is "under 36.25".
  - name: M1.edges
    op: edges
    layers: [M1]
  - name: M1.long
    op: with_length
    min: 0.03625
    layers: [M1.edges]
  - name: M1.short
    op: with_length
    max: 0.03625
    layers: [M1.edges]
  - name: M1.mid
    op: with_length
    min: 0.024
    max: 0.03625
    layers: [M1.edges]
  - name: M1.tiny
    op: with_length
    max: 0.024
    layers: [M1.edges]
  - name: M2.edges
    op: edges
    layers: [M2]
  - name: M2.long
    op: with_length
    min: 0.03625
    layers: [M2.edges]
  - name: M2.short
    op: with_length
    max: 0.03625
    layers: [M2.edges]
  - name: M2.mid
    op: with_length
    min: 0.024
    max: 0.03625
    layers: [M2.edges]
  - name: M2.tiny
    op: with_length
    max: 0.024
    layers: [M2.edges]
  - name: M3.edges
    op: edges
    layers: [M3]
  - name: M3.long
    op: with_length
    min: 0.03625
    layers: [M3.edges]
  - name: M3.short
    op: with_length
    max: 0.03625
    layers: [M3.edges]
  - name: M3.mid
    op: with_length
    min: 0.024
    max: 0.03625
    layers: [M3.edges]
  - name: M3.tiny
    op: with_length
    max: 0.024
    layers: [M3.edges]
  - name: LISD.edges
    op: edges
    layers: [LISD]
  - name: LISD.long
    op: with_length
    min: 0.03625
    layers: [LISD.edges]
  - name: LISD.short
    op: with_length
    max: 0.03625
    layers: [LISD.edges]
  - name: LIG.edges
    op: edges
    layers: [LIG]
  - name: LIG.long
    op: with_length
    min: 0.03625
    layers: [LIG.edges]
  - name: LIG.short
    op: with_length
    max: 0.03625
    layers: [LIG.edges]
  - name: LisdNoSram.edges
    op: edges
    layers: [LisdNoSram]
  - name: LisdNoSram.mid
    op: with_length
    min: 0.024
    max: 0.03625
    layers: [LisdNoSram.edges]
  - name: LisdSram.edges
    op: edges
    layers: [LisdSram]
  - name: LisdSram.short
    op: with_length
    max: 0.03625
    layers: [LisdSram.edges]
  - name: LigNoSram.edges
    op: edges
    layers: [LigNoSram]
  - name: LigNoSram.mid
    op: with_length
    min: 0.024
    max: 0.03625
    layers: [LigNoSram.edges]
  - name: LigNoSram.tiny
    op: with_length
    max: 0.024
    layers: [LigNoSram.edges]
  # M8 and M9: an edge is long from 80 nm.
  - name: M8.edges
    op: edges
    layers: [M8]
  - name: M8.long
    op: with_length
    min: 0.08
    layers: [M8.edges]
  - name: M8.short
    op: with_length
    max: 0.08
    layers: [M8.edges]
  - name: M9.edges
    op: edges
    layers: [M9]
  - name: M9.long
    op: with_length
    min: 0.08
    layers: [M9.edges]
  - name: M9.short
    op: with_length
    max: 0.08
    layers: [M9.edges]
  # Vertical edges lying inside a GATE, or on its outline.
  - name: ACTIVE.edges
    op: edges
    layers: [ACTIVE]
  - name: GCUT.edges
    op: edges
    layers: [GCUT]
  - name: GATE.edges
    op: edges
    layers: [GATE]
  - name: ActiveVEdges
    op: with_angle
    min: 90.0
    max: 90.0
    layers: [ACTIVE.edges]
  - name: ActiveVEdgesInside
    op: inside_part
    layers: [ActiveVEdges, GATE]
  - name: ActiveVEdgesOnGate
    op: and
    layers: [ActiveVEdges, GATE.edges]
  - name: GcutVEdges
    op: with_angle
    min: 90.0
    max: 90.0
    layers: [GCUT.edges]
  - name: GcutVEdgesInside
    op: inside_part
    layers: [GcutVEdges, GATE]
  - name: GcutVEdgesOnGate
    op: and
    layers: [GcutVEdges, GATE.edges]
  - name: LigVEdges
    op: with_angle
    min: 90.0
    max: 90.0
    layers: [LigNoSram.edges]
  - name: LigVEdgesInside
    op: inside_part
    layers: [LigVEdges, GATE]
  - name: LigVEdgesOnGate
    op: and
    layers: [LigVEdges, GATE.edges]
  # ACTIVE.AUX.1: no ACTIVE edge on a select edge.
  - name: Select.edges
    op: edges
    layers: [Select]
  - name: ActiveOnSelectEdge
    op: and
    layers: [ACTIVE.edges, Select.edges]
  # SDT.ACTIVE.AUX.2: an SDT's horizontal edges lie on ACTIVE's, so an SDT does not end
  # inside its ACTIVE.  Where the ACTIVE steps, the libraries run the SDT on past it; the
  # rule reads the edges inside the ACTIVE, off its outline.
  - name: SdtNoSram.edges
    op: edges
    layers: [SdtNoSram]
  - name: SdtHEdges
    op: with_angle
    min: 0.0
    max: 0.0
    layers: [SdtNoSram.edges]
  - name: SdtHEdgesInActive
    op: inside_part
    layers: [SdtHEdges, ACTIVE]
  - name: SdtHEdgesOffActive
    op: not
    layers: [SdtHEdgesInActive, ACTIVE.edges]

