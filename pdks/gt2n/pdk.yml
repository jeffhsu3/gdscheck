# GT2N, the 2 nm nanosheet PDK with backside power delivery from the Georgia Institute
# of Technology (initial release).  Its IC Validator runset (icv_runset/gt2_main.drc.rs)
# is GT3's with seven values changed - a 14 nm gate on a 42 nm pitch, a 16 nm SDCON and
# VBPR, an 8 nm active - and a deck for the five threshold-voltage layers, so this PDK
# extends gt3: the decks that changed are here, the rest are GT3's files.
#
# The backside stack, BV0 to BRDL, joins the buried power rail from below.  The runset
# connects it and checks none of it, and neither does this PDK; its layers are declared
# so the connect graph, and SDCON.2's different-net space, see the backside nets.
# techlib/gt2_tech.lef has additional backside routing and via declarations; these
# are not DRC checks here. See docs/source/pdks/gt2n.rst for the source audit.
name: GT2N
version: "0.1"
extends: gt3

suites:
  - name: main
    path: suites/main.yml
    description: All implemented checks (BV0-BRDL connectivity only)
  - name: feol
    path: suites/feol.yml
    description: Front end and middle of line, through V0 (a standard cell)
  - name: beol
    path: suites/beol.yml
    description: Routing stack, M1 to M6

decks:
  - name: bpr
    path: ../gt3/decks/bpr.yml
    description: Buried power rail
  - name: vbpr
    path: decks/vbpr.yml
    description: Via BPR to SDCON
  - name: gate
    path: decks/gate.yml
    description: Gate
  - name: dummy
    path: decks/dummy.yml
    description: Diffusion-break gate marker
  - name: gcut
    path: ../gt3/decks/gcut.yml
    description: Gate cut
  - name: vg
    path: decks/vg.yml
    description: Gate contact
  - name: act
    path: decks/act.yml
    description: Active
  - name: npsel
    path: ../gt3/decks/npsel.yml
    description: N/P select
  - name: vt
    path: decks/vt.yml
    description: Threshold-voltage layers
  - name: sdcon
    path: decks/sdcon.yml
    description: Source/drain contact
  - name: vsd
    path: ../gt3/decks/vsd.yml
    description: Via SDCON to M0
  - name: m0
    path: ../gt3/decks/m0.yml
    description: Metal 0
  - name: v0
    path: ../gt3/decks/v0.yml
    description: Via 0
  - name: m1
    path: ../gt3/decks/m1.yml
    description: Metal 1
  - name: v1
    path: ../gt3/decks/v1.yml
    description: Via 1
  - name: m2
    path: ../gt3/decks/m2.yml
    description: Metal 2
  - name: v2
    path: ../gt3/decks/v2.yml
    description: Via 2
  - name: m3
    path: ../gt3/decks/m3.yml
    description: Metal 3
  - name: v3
    path: ../gt3/decks/v3.yml
    description: Via 3
  - name: m4
    path: ../gt3/decks/m4.yml
    description: Metal 4
  - name: v4
    path: ../gt3/decks/v4.yml
    description: Via 4
  - name: m5
    path: ../gt3/decks/m5.yml
    description: Metal 5
  - name: v5
    path: ../gt3/decks/v5.yml
    description: Via 5
  - name: m6
